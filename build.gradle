plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.aminndic.schoolalhuda'
    compileSdk 35

    defaultConfig {
        applicationId 'com.aminndic.schoolalhuda'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0'

        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

chaquopy {
    defaultConfig {
        version '3.11'
        pip {
            install 'flask'
            install 'flask-sqlalchemy'
            install 'werkzeug'
            install 'jinja2'
            install 'reportlab'
            install 'arabic-reshaper'
            install 'python-bidi'
            install 'openpyxl'
        }
    }
}
